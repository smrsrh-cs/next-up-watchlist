<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next-Up | Movie & TV Show Watchlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
</head>
<body>

  <main class="app-container">

    <!-- HEADER -->
    <header class="app-header">
      <div class="logo-row">
        <span class="logo-icon">🎬</span>
        <h1>Next-Up</h1>
      </div>
      <p class="subtitle">Never lose track of what to watch next.</p>
    </header>

    <!-- ADD TITLE FORM -->
    <section class="form-section">
      <form id="addForm" class="add-card">
        <h3>Add to Watchlist</h3>
        
        <div class="form-row">
          <input type="text" id="titleInput" placeholder="Movie or Show title (e.g. Inception, The Bear)..." required autocomplete="off">
          
          <select id="typeInput">
            <option value="movie">🎬 Movie</option>
            <option value="show">📺 TV Show</option>
          </select>
        </div>

        <!-- TV Show Episode Tracker Fields (Shown only when TV Show selected) -->
        <div class="form-row episode-row" id="episodeRow" style="display: none;">
          <div class="ep-field">
            <label for="currentEpInput">Current Episode:</label>
            <input type="number" id="currentEpInput" min="0" value="0">
          </div>
          <div class="ep-field">
            <label for="totalEpInput">Total Episodes:</label>
            <input type="number" id="totalEpInput" min="1" value="10">
          </div>
        </div>

        <div class="form-row form-actions">
          <select id="statusInput">
            <option value="plan">📌 Plan to Watch</option>
            <option value="watching">🍿 Watching</option>
            <option value="completed">✅ Completed</option>
          </select>

          <button type="submit" class="btn-primary">+ Add Title</button>
        </div>
      </form>
    </section>

    <!-- FILTER TABS -->
    <section class="filter-section">
      <div class="tabs">
        <button class="tab-btn active" data-filter="all">All (<span id="countAll">0</span>)</button>
        <button class="tab-btn" data-filter="movie">🎬 Movies (<span id="countMovie">0</span>)</button>
        <button class="tab-btn" data-filter="show">📺 TV Shows (<span id="countShow">0</span>)</button>
        <button class="tab-btn" data-filter="watching">🍿 Watching (<span id="countWatching">0</span>)</button>
        <button class="tab-btn" data-filter="completed">✅ Completed (<span id="countCompleted">0</span>)</button>
      </div>
    </section>

    <!-- WATCHLIST ITEMS -->
    <section class="watchlist-section" id="watchlistContainer">
      <!-- Cards rendered by app.js -->
    </section>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <p>🎬 Your watchlist is empty in this category. Add a title above!</p>
    </div>

    <!-- FOOTER -->
    <footer class="app-footer">
      <p>Next-Up • Movie & TV Show Watchlist</p>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
